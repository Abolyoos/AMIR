<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amir - Robot Control</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            margin-bottom: 15px;
            color: #00e676;
        }

        .stream-container {
            width: 100%;
            max-width: 640px;
            /* Ändra height från fixed 360px till auto så att höjden anpassas efter bildförhållandet */
            height: auto;
            min-height: 360px;
            background-color: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 2px solid #333;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .camera-stream {
            width: 100%;
            height: auto;
            /* Låt bilden behålla sina naturliga proportioner */
            display: block;
            background-color: #000;
        }

        .stream-placeholder {
            color: #888;
            font-size: 16px;
            text-align: center;
            padding: 20px;
        }

        .stream-btn-container {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .btn-stream {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-start {
            background-color: #00e676;
            color: #000;
        }

        .btn-start:hover {
            background-color: #00c853;
        }

        .btn-stop-stream {
            background-color: #ff5252;
            color: #fff;
        }

        .btn-stop-stream:hover {
            background-color: #d32f2f;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(3, 80px);
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.1s;
        }

        .btn:active {
            background-color: #00e676;
            color: #000;
        }

        .btn-up {
            grid-column: 2;
            grid-row: 1;
        }

        .btn-left {
            grid-column: 1;
            grid-row: 2;
        }

        .btn-stop {
            grid-column: 2;
            grid-row: 2;
            background-color: #d32f2f;
        }

        .btn-right {
            grid-column: 3;
            grid-row: 2;
        }

        .btn-down {
            grid-column: 2;
            grid-row: 3;
        }
    </style>
</head>

<body>

    <h1>Roboten Amir</h1>

    <div class="stream-container" id="streamContainer">
        <div id="placeholder" class="stream-placeholder">Klicka på "Starta Videoström" nedan för att visa kameran</div>
    </div>

    <div class="stream-btn-container">
        <button class="btn-stream btn-start" onclick="toggleStream(true)">Starta Videoström</button>
        <button class="btn-stream btn-stop-stream" onclick="toggleStream(false)">Stoppa Videoström</button>
    </div>

    <div class="controls">
        <button class="btn btn-up" onmousedown="sendCmd('forward')" onmouseup="sendCmd('stop')"
            ontouchstart="sendCmd('forward')" ontouchend="sendCmd('stop')">▲</button>
        <button class="btn btn-left" onmousedown="sendCmd('left')" onmouseup="sendCmd('stop')"
            ontouchstart="sendCmd('left')" ontouchend="sendCmd('stop')">◄</button>
        <button class="btn btn-stop" onclick="sendCmd('stop')">OFF</button>
        <button class="btn btn-right" onmousedown="sendCmd('right')" onmouseup="sendCmd('stop')"
            ontouchstart="sendCmd('right')" ontouchend="sendCmd('stop')">►</button>
        <button class="btn btn-down" onmousedown="sendCmd('backward')" onmouseup="sendCmd('stop')"
            ontouchstart="sendCmd('backward')" ontouchend="sendCmd('stop')">▼</button>
    </div>

    <script>
        const esp32Ip = "http://192.168.1.145";
        let currentImg = null;

        function toggleStream(start) {
            const container = document.getElementById('streamContainer');
            const placeholder = document.getElementById('placeholder');

            if (start) {
                // Ta bort gammal bild om den finns
                if (currentImg) {
                    container.removeChild(currentImg);
                }

                // Skapa en ny bildtagg dynamiskt
                currentImg = document.createElement('img');
                currentImg.className = 'camera-stream';

                // Tvinga ny anslutning med unikt tidsvärde
                currentImg.src = `${esp32Ip}:81/stream?t=${new Date().getTime()}`;

                currentImg.onerror = function () {
                    console.error("Kunde inte ladda videoströmmen. Kontrollera att ESP32 är igång och har IP 192.168.1.145.");
                };

                container.appendChild(currentImg);
                placeholder.style.display = 'none';
            } else {
                if (currentImg) {
                    currentImg.src = ""; // Stoppa strömmen
                    container.removeChild(currentImg);
                    currentImg = null;
                }
                placeholder.style.display = 'block';
            }
        }

        function sendCmd(command) {
            console.log("Skickar kommando:", command);
            fetch(`${esp32Ip}/control?var=car&val=${command}`, { mode: 'no-cors' })
                .then(() => {
                    console.log("Kommando skickat ok:", command);
                })
                .catch(error => {
                    console.error("Nätverksfel vid styrning:", error);
                });
        }

        // Tangentbordsstyrning (Piltangenter)
        document.addEventListener('keydown', (event) => {
            if (event.repeat) return;
            if (event.key === 'ArrowUp') sendCmd('forward');
            if (event.key === 'ArrowDown') sendCmd('backward');
            if (event.key === 'ArrowLeft') sendCmd('left');
            if (event.key === 'ArrowRight') sendCmd('right');
        });

        document.addEventListener('keyup', (event) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
                sendCmd('stop');
            }
        });
    </script>

</body>

</html>
