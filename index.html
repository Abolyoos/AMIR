<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <!-- Hindrar mobilen från att zooma in när man trycker snabbt på knapparna -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amir - Robot Control</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-touch-callout: none; /* Hindrar menyer vid långtryck på mobil */
            -webkit-user-select: none;   /* Hindrar markering av text */
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }

        h1 {
            font-size: 1.4rem;
            margin: 5px 0 10px 0;
            color: #00e676;
            text-align: center;
        }

        /* Maximera videon för mobilen */
        .stream-container {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 4 / 3; /* Bevarar kamera-proportionerna */
            background-color: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            border: 2px solid #2a2a2a;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .camera-stream {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background-color: #000;
        }

        .stream-placeholder {
            color: #aaa;
            font-size: 0.95rem;
            text-align: center;
            padding: 15px;
        }

        /* Knappkontroller för videoström */
        .stream-btn-container {
            margin: 10px 0;
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 500px;
        }

        .btn-stream {
            flex: 1;
            padding: 12px 0;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }

        .btn-start {
            background-color: #00e676;
            color: #000;
        }

        .btn-stop-stream {
            background-color: #ff5252;
            color: #fff;
        }

        /* Styrkontroller anpassade för tummar på mobil */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 320px;
            height: 320px;
            margin-bottom: 15px;
        }

        .btn {
            background-color: #262626;
            color: #fff;
            border: 1px solid #3d3d3d;
            border-radius: 16px;
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.4);
            touch-action: manipulation;
        }

        /* Visuell feedback när man trycker med fingret */
        .btn:active, .btn.active {
            background-color: #00e676;
            color: #000;
            transform: scale(0.96);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .btn-up {
            grid-column: 2;
            grid-row: 1;
        }

        .btn-left {
            grid-column: 1;
            grid-row: 2;
        }

        .btn-stop {
            grid-column: 2;
            grid-row: 2;
            background-color: #d32f2f;
            font-size: 1.1rem;
        }

        .btn-stop:active {
            background-color: #ff1744;
            color: #fff;
        }

        .btn-right {
            grid-column: 3;
            grid-row: 2;
        }

        .btn-down {
            grid-column: 2;
            grid-row: 3;
        }
    </style>
</head>

<body>

    <h1>Roboten Amir</h1>

    <!-- Videofönster -->
    <div class="stream-container" id="streamContainer">
        <div id="placeholder" class="stream-placeholder">Tryck på "Starta Kamera" för att se videon</div>
    </div>

    <!-- Start / Stopp för video -->
    <div class="stream-btn-container">
        <button class="btn-stream btn-start" onclick="toggleStream(true)">Starta Kamera</button>
        <button class="btn-stream btn-stop-stream" onclick="toggleStream(false)">Stoppa Kamera</button>
    </div>

    <!-- Styrknappar för mobiltummar -->
    <div class="controls">
        <button class="btn btn-up" 
                ontouchstart="handleTouchStart(event, 'forward')" ontouchend="handleTouchEnd(event)" 
                onmousedown="sendCmd('forward')" onmouseup="sendCmd('stop')">▲</button>

        <button class="btn btn-left" 
                ontouchstart="handleTouchStart(event, 'left')" ontouchend="handleTouchEnd(event)" 
                onmousedown="sendCmd('left')" onmouseup="sendCmd('stop')">◄</button>

        <button class="btn btn-stop" onclick="sendCmd('stop')">OFF</button>

        <button class="btn btn-right" 
                ontouchstart="handleTouchStart(event, 'right')" ontouchend="handleTouchEnd(event)" 
                onmousedown="sendCmd('right')" onmouseup="sendCmd('stop')">►</button>

        <button class="btn btn-down" 
                ontouchstart="handleTouchStart(event, 'backward')" ontouchend="handleTouchEnd(event)" 
                onmousedown="sendCmd('backward')" onmouseup="sendCmd('stop')">▼</button>
    </div>

    <script>
        const esp32Ip = "http://192.168.1.145";
        let currentImg = null;

        function toggleStream(start) {
            const container = document.getElementById('streamContainer');
            const placeholder = document.getElementById('placeholder');

            if (start) {
                if (currentImg) {
                    container.removeChild(currentImg);
                }

                currentImg = document.createElement('img');
                currentImg.className = 'camera-stream';
                currentImg.src = `${esp32Ip}:81/stream?t=${new Date().getTime()}`;

                currentImg.onerror = function() {
                    console.error("Kunde inte ladda videoströmmen.");
                };

                container.appendChild(currentImg);
                placeholder.style.display = 'none';
            } else {
                if (currentImg) {
                    currentImg.src = "";
                    container.removeChild(currentImg);
                    currentImg = null;
                }
                placeholder.style.display = 'block';
            }
        }

        function sendCmd(command) {
            console.log("Skickar kommando:", command);
            fetch(`${esp32Ip}/control?var=car&val=${command}`, { mode: 'no-cors' })
                .catch(error => {
                    console.error("Nätverksfel vid styrning:", error);
                });
        }

        // Snabb touch-hantering för mobiler
        function handleTouchStart(event, command) {
            event.preventDefault(); // Forcerar direkt touch-respons utan fördröjning
            sendCmd(command);
        }

        function handleTouchEnd(event) {
            event.preventDefault();
            sendCmd('stop');
        }

        // Tangentbordsstyrning om du också testar på dator
        document.addEventListener('keydown', (event) => {
            if (event.repeat) return;
            if (event.key === 'ArrowUp') sendCmd('forward');
            if (event.key === 'ArrowDown') sendCmd('backward');
            if (event.key === 'ArrowLeft') sendCmd('left');
            if (event.key === 'ArrowRight') sendCmd('right');
        });

        document.addEventListener('keyup', (event) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
                sendCmd('stop');
            }
        });
    </script>

</body>

</html>
